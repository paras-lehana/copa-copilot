# Cloud Build: build + deploy the Copa Copilot web app to Cloud Run.
# _API_BASE_URL is baked into the client bundle at build time (NEXT_PUBLIC_*).
substitutions:
  _REGION: us-central1
  _SERVICE: copa-copilot-web
  _REPO: copa-copilot
  _API_BASE_URL: ''

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID
      - --build-arg
      - API_BASE_URL=${_API_BASE_URL}
      - -f
      - apps/web/Dockerfile
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID']
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --max-instances=3

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/web:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
